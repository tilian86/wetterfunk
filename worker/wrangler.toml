name = "wetterfunk"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Schlüssel nicht hier eintragen, sondern:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put VAPID_PRIVATE

# Abos für Regenwarnungen
[[kv_namespaces]]
binding = "WF_PUSH"
id = "47a55c12ad0544398c1a12c06c254ed2"

# Alle 5 Minuten prüfen: Ein Schauer, der nur 20 Minuten Vorlauf im
# Kurzfrist-Takt hat, wäre beim 15-Minuten-Takt im schlimmsten Fall schon
# gefallen, bevor die Prüfung überhaupt lief.
[triggers]
# Alle fünf Minuten die Regenwache, um 03:20 UTC der tägliche Prüflauf
crons = ["*/5 * * * *", "20 3 * * *"]

[vars]
VAPID_PUBLIC = "BD_3JQs9OeMY8GfVSpKkOpa4JYyQ9Te2meM2qgFGB5oBtSFkNHbTGaSN7HKYAYO-1bfweUNvDRpkpk2a937-Oow"
VAPID_SUBJECT = "mailto:florian.s.thiel@gmail.com"

# Vorgerechnete Radarbilder: je Fünf-Minuten-Schritt EIN Deutschland-Bild.
# Vergangenes ändert sich nie und bleibt liegen (täglicher Putzlauf löscht
# nach 3 Tagen); damit ist die Zeitleiste für alle Nutzer sofort da, ohne
# dass der DWD für jede Kachel neu rechnen muss.
[[r2_buckets]]
binding = "RADAR_BILDER"
bucket_name = "wetterfunk-radar"
