name = "wetterfunk"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Schlüssel nicht hier eintragen, sondern:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put VAPID_PRIVATE

# Abos für Regenwarnungen
[[kv_namespaces]]
binding = "WF_PUSH"
id = "47a55c12ad0544398c1a12c06c254ed2"

# Alle 5 Minuten prüfen: Ein Schauer, der nur 20 Minuten Vorlauf im
# Kurzfrist-Takt hat, wäre beim 15-Minuten-Takt im schlimmsten Fall schon
# gefallen, bevor die Prüfung überhaupt lief.
[triggers]
crons = ["*/5 * * * *"]

